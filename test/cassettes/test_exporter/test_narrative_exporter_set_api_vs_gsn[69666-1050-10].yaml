        = bare_type.split(\".\")[0]\n\n    type_spec = self._sm.get_type_spec(bare_type,
        raise_exception=False)\n\n    if type_spec is None:\n        print(f''no type
        spec for {bare_type}'')\n        widget_data = {\n            \"error\": {\n                \"msg\":
        f\"Unable to find viewer specification for objects of type {bare_type}.\",\n                \"method_name\":
        \"WidgetManager.show_data_widget\",\n                \"traceback\": f\"Can''t
        find type spec info for type {bare_type}\",\n            }\n        }\n        upas[\"upas\"]
        = [upa]  # doompety-doo\n    else:\n        print(\"type spec:\")\n        print(type_spec)\n        if
        not type_spec.get(\"view_method_ids\"):\n            return f\"No viewer found
        for objects of type {bare_type}\"\n        app_id = type_spec[\"view_method_ids\"][0]\n        app_spec
        = None\n        try:\n            app_spec = self._sm.get_spec(app_id, tag=tag)\n        except
        Exception as e:\n            widget_data = {\n                \"error\": {\n                    \"msg\":
        f\"Unable to find specification for viewer app {app_id}\",\n                    \"method_name\":
        \"WidgetManager.show_data_widget\",\n                    \"traceback\": e.message,\n                }\n            }\n        if
        app_spec is not None:\n            spec_params = self._sm.app_params(app_spec)\n            input_params
        = {}\n            is_ref_path = \";\" in upa\n            is_external = info_tuple[7]
        != os.environ[\"KB_WORKSPACE_ID\"]\n            # it''s not safe to use reference
