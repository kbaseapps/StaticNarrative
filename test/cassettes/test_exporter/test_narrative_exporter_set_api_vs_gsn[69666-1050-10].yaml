        App allows the user to group individual <b><i>Assembly</i></b> objects into
        an <b><i>Assembly Set</i></b>.</p>\n<p>\n<h3>Description</h3>\n<b>Batch Create
        Assembly Set</b> allows a user to create a Set of Assemblies (each one of
        which is a group of contigs or scaffold genome fragments) which can be used
        in subsequent Apps that operate on Assembly Sets.  Each Assembly object must
        already be within the Narrative''s data workspace, so if there are assemblies
        from other Narratives or assemblies from public reference genomes that the
        user wishes to include, they must first be imported into the active Narrative.  All
        Assemblies that match the <i>Name Pattern</i> will be included in the Set.  If
        the <i>Name Pattern</i> is left blank, all assembly objects in the current
        Narrative will be included.\n</p>\n<p>Example allowed <i>Name Patterns</i>:<br>\n<ul>\n<li>
        <b>*.Assembly</b>\n<li> <b>Sample_1-*</b>\n<li> <b>Sample_1-*.Assembly</b>\n</ul>\n</p>\n\n<p><hr></p>\n<p><strong>Team
        members who developed &amp; deployed App in KBase:</strong> <a href=\"https://narrative.kbase.us/#people/dylan\">Dylan
        Chivian</a>. For questions, please <a href= http://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><strong>Please cite:</strong>\n  <ul>\n    <li>Chivian D,
