      string: '{"version":"1.1","result":[[{"id":"kb_SetUtilities/KButil_Build_AssemblySet","module_name":"kb_SetUtilities","git_commit_hash":"79b273010c6c30b9343e03b64b7d7502ded704ce","name":"Build
        AssemblySet - v1.0.1","ver":"1.9.0","authors":["dylan"],"contact":"http://www.kbase.us/support/","subtitle":"Allows
        users to create an AssemblySet object.","tooltip":"Allows users to create
        an AssemblySet object.","description":"<p><b>Build Assembly Set</b> allows
        a user to create a Set of Assemblies (each of which is a group of contigs
        or scaffold genome fragments) which can be used in subsequent Apps that operate
        on AssemblySets, thus allowing for bulk operations on Assembly objects. Each
        Assembly object must already be within the Narrative''s data workspace, so
        if there are Assemblies from other Narratives or from public reference genomes
        that the user wishes to include, they must first be imported into the active
        Narrative. Simply click the <b> + </b> plus icon to add an Assembly object
        to the set. Once the plus icon is hit, a dropdown list will appear that is
        populated with all the Assembly objects in this narrative.</p>\n\n<p><hr></p>\n<p><strong>Team
        members who developed &amp; deployed App in KBase:</strong> <a href=\"https://narrative.kbase.us/#people/dylan\">Dylan
        Chivian</a>. For questions, please <a href= http://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><strong>Please cite:</strong>\n  <ul>\n    <li>Chivian D,
        Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM, Gu
        T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
        RW, Henry CS, Arkin AP. Metagenome-assembled genome extraction and analysis
        from microbiomes using KBase. Nat Protoc. 2023 Jan;18(1):208-238. doi: 10.1038/s41596-022-00747-x\n  </ul>\n</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":["RAST_SDK.annotate_contigsets","kb_Msuite.run_checkM_lineage_wf","kb_assembly_compare.run_contig_distribution_compare","kb_assembly_compare.run_filter_contigs_by_length"]},"icon":{"url":"img?method_id=kb_SetUtilities/KButil_Build_AssemblySet&image_name=kb-blue.png&tag=release"},"categories":["active","util","assembly","annotation"],"screenshots":[{"url":"img?method_id=kb_SetUtilities/KButil_Build_AssemblySet&image_name=Build_AssemblySet.png&tag=release"}],"publications":[{"pmid":"36376589","display_text":"Chivian
        D, Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM,
        Gu T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
        RW, Henry CS, Arkin AP. Metagenome-assembled genome extraction and analysis
        from microbiomes using KBase. Nat Protoc. 2023 Jan;18(1):208-238. doi: 10.1038/s41596-022-00747-x\n","link":"https://www.nature.com/articles/s41596-022-00747-x"},{"display_text":"Arkin
        AP, Cottingham RW, Henry CS, Harris NL, Stevens RL, Maslov S, et al. KBase:
        The United States Department of Energy Systems Biology Knowledgebase. Nature
        Biotechnology. 2018;36: 566. doi: 10.1038/nbt.4163\n","link":"https://www.nature.com/articles/nbt.4163"}],"namespace":"kb_SetUtilities"},{"id":"kb_SetUtilities/KButil_Build_ReadsSet","module_name":"kb_SetUtilities","git_commit_hash":"79b273010c6c30b9343e03b64b7d7502ded704ce","name":"Build
        ReadsSet - v1.7.6","ver":"1.9.0","authors":["dylan"],"contact":"http://www.kbase.us/support/","subtitle":"Allows
        users to create a ReadsSet object.","tooltip":"Allows users to create a ReadsSet
        object.","description":"<p><b>Build Reads Set</b> allows a user to create
        a set of related Reads Libraries (each of which is a set inferred sequence
        of base pairs corresponding to all or part of a single DNA fragment). These
        <b>Reads Library</b> objects are typically created when importing FASTQ or
        FASTA format sequences. This greatly eases further processing within KBase.
        The ReadsSet can be used in subsequent Apps that operate on ReadsSets, thus
        allowing for bulk operations on the ReadsSet objects sparing the user from
        the need to specify and track individual libraries through a workflow pipeline.</p>\n\n<p><hr></p>\n<p>Typically,
        all the Reads Libraries in a given set that have followed the same processing
        will undergo the same analysis within KBase, and are generally part of the
        same (or a similar) study.</p>\n\n<p>The Reads Libraries should all be either
        Single-End (it starts at one read, finishes this direction at the specified
        read length, and then starts another round of reading from the opposite end
        of the fragment) or Paired-End (the sequencer starts at one read, finishes
        this direction at the specified read length, and then starts another round
        of reading from the opposite end of the fragment), but not both.</p>\n\n<p>The
        input Reads Libraries must already exist within the Narrative''s data workspace.
        If there are reads libraries from other Narratives or public data that the
        user wishes to include, they must first be imported into the active Narrative.</p>\n\n<p><hr></p>\n<p><b>Running
        the App:</b> Simply click the <b> + </b> plus icon to add each Reads Library
        object to the set. Once the plus icon for each input library object is hit,
        a dropdown list will appear that is populated with all the Reads Library objects
        in the Narrative. Select one at a time.</p>\n\n<p>Two other text inputs are
        mandatory: a meaningful description and the name of the <b>ReadsSet</b> object
        to be created.</p>\n\n\n<p><hr></p>\n<p><strong>Team members who developed
        &amp; deployed App in KBase:</strong> <a href=\"https://narrative.kbase.us/#people/dylan\">Dylan
        Chivian</a>. For questions, please <a href= http://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><strong>Please cite:</strong>\n  <ul>\n    <li>Chivian D,
        Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM, Gu
        T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
        RW, Henry CS, Arkin AP. Metagenome-assembled genome extraction and analysis
        from microbiomes using KBase. Nat Protoc. 2023 Jan;18(1):208-238. doi: 10.1038/s41596-022-00747-x\n  </ul>\n</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":["align_reads_using_hisat2","run_kaiju","run_gottcha2","run_trimmomatic"]},"icon":{"url":"img?method_id=kb_SetUtilities/KButil_Build_ReadsSet&image_name=kb-pink.png&tag=release"},"categories":["active","util","reads"],"screenshots":[{"url":"img?method_id=kb_SetUtilities/KButil_Build_ReadsSet&image_name=Build_ReadsSet.png&tag=release"}],"publications":[{"pmid":"36376589","display_text":"Chivian
        D, Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM,
