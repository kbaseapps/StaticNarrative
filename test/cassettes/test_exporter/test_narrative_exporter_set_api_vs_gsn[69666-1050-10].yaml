        Reads Set</b> allows a user to create a set of related Reads Libraries (each
        of which is a set inferred sequence of base pairs corresponding to all or
        part of a single DNA fragment). These <b>Reads Library</b> objects are typically
        created when importing FASTQ or FASTA format sequences. This greatly eases
        further processing within KBase. The ReadsSet can be used in subsequent Apps
        that operate on ReadsSets, thus allowing for bulk operations on the ReadsSet
        objects sparing the user from the need to specify and track individual libraries
        through a workflow pipeline.</p>\n\n<p><hr></p>\n<p>Typically, all the Reads
        Libraries in a given set that have followed the same processing will undergo
        the same analysis within KBase, and are generally part of the same (or a similar)
        study.</p>\n\n<p>The Reads Libraries should all be either Single-End (it starts
        at one read, finishes this direction at the specified read length, and then
        starts another round of reading from the opposite end of the fragment) or
        Paired-End (the sequencer starts at one read, finishes this direction at the
        specified read length, and then starts another round of reading from the opposite
        end of the fragment), but not both.</p>\n\n<p>The input Reads Libraries must
        already exist within the Narrative''s data workspace. If there are reads libraries
        from other Narratives or public data that the user wishes to include, they
        must first be imported into the active Narrative.</p>\n\n<p><hr></p>\n<p><b>Running
        the App:</b> Simply click the <b> + </b> plus icon to add each Reads Library
        object to the set. Once the plus icon for each input library object is hit,
        a dropdown list will appear that is populated with all the Reads Library objects
        in the Narrative. Select one at a time.</p>\n\n<p>Two other text inputs are
        mandatory: a meaningful description and the name of the <b>ReadsSet</b> object
        to be created.</p>\n\n\n<p><hr></p>\n<p><strong>Team members who developed
        &amp; deployed App in KBase:</strong> <a href=\"https://narrative.kbase.us/#people/dylan\">Dylan
        Chivian</a>. For questions, please <a href= http://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><strong>Please cite:</strong>\n  <ul>\n    <li>Chivian D,
        Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM, Gu
        T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
