        GenomeSet - v1.7.6","ver":"1.9.0","authors":["dylan"],"contact":"http://www.kbase.us/support/","subtitle":"Allows
        users to create a GenomeSet object.","tooltip":"Allows users to create a GenomeSet
        object.","description":"<p><b>Build Genome Set</b> allows a user to create
        a set of Genomes (each consisting of functional and structural annotations
        for a corresponding assembly). The GenomeSet can be used in subsequent Apps
