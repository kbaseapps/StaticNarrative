        the <i>Name Pattern</i> is left blank, all assembly objects in the current
        Narrative will be included.\n</p>\n<p>Example allowed <i>Name Patterns</i>:<br>\n<ul>\n<li>
        <b>*.Assembly</b>\n<li> <b>Sample_1-*</b>\n<li> <b>Sample_1-*.Assembly</b>\n</ul>\n</p>\n\n<p><hr></p>\n<p><strong>Team
