        = obj_param_value\n                    upa_params.append(param[\"id\"])\n\n            (input_params,
        ws_refs) = validate_parameters(\n                app_id, tag, spec_params,
        input_params\n            )\n            (widget_name, widget_data) = map_outputs_from_state(\n                [],
        input_params, app_spec\n            )\n\n            # Figure out params for
        upas.\n            for mapping in app_spec.get(\"behavior\", {}).get(\"output_mapping\",
        []):\n                if (\n                    mapping.get(\"input_parameter\",
        \"\") in upa_params\n                    and \"target_property\" in mapping\n                ):\n                    upas[mapping[\"target_property\"]]
        = upa\n                    \n        return {\n            \"widget_name\":
        widget_name,\n            \"widget_data\": widget_data,\n            \"upas\":
        upas,\n            \"title\": title,\n            \"type\": \"viewer\",\n            \"cell_id\":
