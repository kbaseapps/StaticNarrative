        AP, Cottingham RW, Henry CS, Harris NL, Stevens RL, Maslov S, et al. KBase:
        The United States Department of Energy Systems Biology Knowledgebase. Nature
        Biotechnology. 2018;36: 566. doi: 10.1038/nbt.4163\n","link":"https://www.nature.com/articles/nbt.4163"}],"namespace":"kb_SetUtilities"},{"id":"FeatureSetUtils/build_feature_set","module_name":"FeatureSetUtils","git_commit_hash":"c5b615ea30a4b3cdb0fdc7ac1485607638f624b8","name":"Build
        FeatureSet from Genome","ver":"1.2.6","authors":["jjeffryes"],"contact":"help@kbase.us","subtitle":"Create
        a new FeatureSet by selecting features from a Genome.","tooltip":"Create a
        new FeatureSet by selecting features from a Genome.","description":"<p>FeatureSets
        are useful for grouping a set of proteinencoding gene features and performing
        some operation on that set of features. For instance, instead of specifying
        all the features in a list for each App, you can use this App to build a single
        FeatureSet and then use this as input for other Apps. There are quite a few
        Apps that accept a FeatureSet as input, including types of BLAST, MUSCLE,
        and expression analysis. FeatureSets are also shareable, so it allows you
        to call out or comment on specific features in your Narrative.</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":["KButil_Build_GenomeSet_from_FeatureSet","functional_enrichment_go_term","KButil_Logical_Slice_Two_FeatureSets","KButil_Logical_Slice_Two_FeatureSets","KButil_Merge_FeatureSet_Collection","MUSCLE_nuc","MUSCLE_prot","KButil_Slice_FeatureSets_by_Genomes","view_fxn_profile_featureSet","filter_matrix_by_feature_set","functional_enrichment_go_term","view_expression_heatmap","view_expression_profile","view_expression_pairwise_correlation","BLASTn_Search","BLASTp_Search","BLASTx_Search","HMMER_MSA_Search","psiBLAST_msa_start_Search","tBLASTx_Search"],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=FeatureSetUtils/build_feature_set&image_name=kb-orange.png&tag=release"},"categories":["active","comparative_genomics","util"],"screenshots":[],"publications":[{"display_text":"Arkin
