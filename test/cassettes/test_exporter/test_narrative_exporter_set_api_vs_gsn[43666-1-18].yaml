      string: '{"version":"1.1","result":[[{"id":"kb_quast/run_QUAST_app","module_name":"kb_quast","git_commit_hash":"f6be7c27bbf44a0d65b0250dbdb8079b5df9d7ae","name":"Assess
        Quality of Assemblies with QUAST - v4.4","ver":"1.0.0","authors":["gaprice"],"contact":"http://kbase.us/contact-us/","subtitle":"Run
        QUAST (QUality ASsessment Tool) on a set of Assemblies to assess their quality.","tooltip":"Run
        QUAST (QUality ASsessment Tool) on a set of Assemblies to assess their quality.","description":"<p>This
        is the KBase wrapper for version 4.4 of the <a href=\"http://quast.sourceforge.net/\"
        target=\"_blank\">QUAST</a> assembly quality assessment tool. QUAST evaluates
        assemblies by computing various metrics, including number of contigs, N50/75,
        L50/75, GC content, number of uncalled bases (N s), and predicted genes. It
        takes one or more Assembly objects as input and then generates an output report
        with statistics for all of the input assemblies.</p>\n\n<p>Use QUAST to assess
        the output assemblies from different configurations of the same assembler,
        or compare assemblies from multiple assemblers to determine which one is optimal
        for downstream analysis. The QUAST report color codes \"worst, median, best\"
        for each of the statistics generated, but pay attention to the degree of difference
        between the lengths and values to better understand how the parameters of
        your assembler relate to the resulting Assembly.</p>\n\n<p><h3>Reading the
        QUAST output report:</h3>\n<ul>\n    <li><b># contigs</b> is the total number
        of contigs in the Assembly.</li>\n    <li><b>Largest contig</b> is the length
        of the longest contig in the Assembly.</li>\n    <li><b>Total length</b> is
        the total number of bases in the Assembly.</li>\n    <li><b>GC (%)</b> is
        the total number of G and C nucleotides in the Assembly, divided by the total
        length of the Assembly.</li>\n    <li><b>N50</b> is the length for which the
        collection of all contigs of that length or longer covers at least half (50%)
        the total base content of the Assembly. It serves as a median value for assessing
        whether the Assembly is balanced towards longer contigs (higher N50) or shorter
        contigs (lower N50). N75 is used for the same purpose but is the length is
        set at 75% of total base content instead of 50%.</li>\n    <li><b>L50 is the
        number of contigs equal to or longer than the N50 length. In other words,
        L50, is the minimal number of contigs that contain half the total base content
        of the Assembly. L75 is used for the same purpose in reference to the N75
        length.</li>\n</ul>\n</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_quast/run_QUAST_app&image_name=quast-blue_360.png&tag=release"},"categories":["assembly"],"screenshots":[],"publications":[{"pmid":"23422339","display_text":"[1]
        Gurevich A, Saveliev V, Vyahhi N, Tesler G. QUAST: quality assessment tool
        for genome assemblies. Bioinformatics. 2013;29: 1072 1075. doi:10.1093/bioinformatics/btt086\n","link":"https://www.ncbi.nlm.nih.gov/pubmed/23422339"},{"pmid":"27378299","display_text":"[2]
        Mikheenko A, Valin G, Prjibelski A, Saveliev V, Gurevich A. Icarus: visualizer
        for de novo assembly evaluation. Bioinformatics. 2016;32: 3321 3323. doi:10.1093/bioinformatics/btw379\n","link":"https://www.ncbi.nlm.nih.gov/pubmed/27378299"}],"namespace":"kb_quast"},{"id":"ProkkaAnnotation/annotate_contigs","module_name":"ProkkaAnnotation","git_commit_hash":"1967e07320b1898db0c6998bb4549b7f1187e5a8","name":"Annotate
        Assembly and Re-annotate Genomes with Prokka - v1.14.5","ver":"3.2.1","authors":["rsutormin","bsadkhin","slebras"],"contact":"https://www.kbase.us/support/","subtitle":"Annotate
        Assembly and Re-annotate Genomes with Prokka annotation pipeline.","tooltip":"Annotate
        Assembly and Re-annotate Genomes with Prokka annotation pipeline.","description":"<p>\nThis
        is a KBase wrapper for the\n<a href=\"http://www.bioinformatics.net.au/software.prokka.shtml\"
        target=\"_blank\">Prokka</a>\nannotation pipeline.\n</p>\n\n<p>\nProkka is
        a software tool for the rapid annotation of prokaryotic genomes. A typical
        4Mbp genome can be fully annotated in less than 20 minutes.\n</p>\n\n<p>\nFor
        rRNA prediction this app currently uses Barrnap (written by the author of
        Prokka and recommended if you prefer speed over absolute accuracy).\n</p>\n\n<p>\nSee
        more information at https://github.com/kbaseapps/ProkkaAnnotation/blob/master/README.rst\n</p>\n\n<p>Prokka
        version: 1.14.5</p>\n<p>Barrnap version: 0.8</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=ProkkaAnnotation/annotate_contigs&image_name=prokka.png&tag=release"},"categories":["active","annotation"],"screenshots":[],"publications":[{"pmid":"24642063","display_text":"Seemann
