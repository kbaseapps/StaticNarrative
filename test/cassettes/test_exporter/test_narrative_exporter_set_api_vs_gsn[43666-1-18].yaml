        results, visualizations and commentary. [Learn more...](http://kbase.us/narrative-guide)\n\n**Take
        the Tour:** Choose \"Narrative Tour\" from the \"Help\" menu above. The tour
        walks you through the user interface, pointing out various useful aspects
        of it.\n\n**Get Some Data:** Click the Add Data button in the Data Panel to
        search KBase data or upload your own. Hover over a data object to reveal a
        button for adding it to your Narrative. [Learn more...](http://kbase.us/narrative-guide/explore-data)\n\n**Analyze
