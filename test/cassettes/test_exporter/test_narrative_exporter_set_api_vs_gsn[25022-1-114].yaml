        FASTA File as Assembly from Staging Area","ver":"1.0.56","authors":["tgu2"],"contact":"http://kbase.us/contact-us/","subtitle":"Import
        a FASTA file from your staging area into your Narrative as an Assembly data
        object","tooltip":"Import a FASTA file from your staging area into your Narrative
        as an Assembly data object","description":"<p> Import a FASTA file from your
        staging area into your Narrative as an Assembly data object.\nPlease see the
        <a href=\"http://kbase.us/data-upload-download-guide/\">Data Upload/Download
        Guide</a> for more information. </p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_uploadmethods/import_fasta_as_assembly_from_staging&image_name=data-blue.png&tag=release"},"categories":["inactive","reads","upload"],"screenshots":[],"publications":[],"namespace":"kb_uploadmethods"},{"id":"kb_SPAdes/run_metaSPAdes","module_name":"kb_SPAdes","git_commit_hash":"ee3f83f9d451a7d0ad86709e55e8653bee497e30","name":"Assemble
        Reads with metaSPAdes - v3.15.3","ver":"1.3.4","authors":["gaprice","dylan"],"contact":"http://kbase.us/support/","subtitle":"Assemble
        metagenomic reads using the SPAdes assembler.","tooltip":"Assemble metagenomic
        reads using the SPAdes assembler.","description":"<p>This is a KBase wrapper
        for the <a href=\"http://cab.spbu.ru/software/spades/\" target=\"_blank\">metaSPAdes</a>
        genomic reads assembler. MetaSPAdes is designed for assembling shotgun metagenomic
        reads.</p>\n\n<p><b>Operational notes:</b>\n<ul>\n  <li>Currently the wrapper
        only supports Illumina, IonTorrent, PacBIO CLR and PacBIO CCS in FASTQ format,
        either uncompressed or gzipped.</li>\n  <li>The --careful flag is always used,
        except for metagenomic assemblies where it is not allowed.</li>\n  <li>Metagenome
        and Plasmid assembly can only be run on one reads library.</li>\n  <li>Metagenome
        assembly can only be run on a paired end library.</li>\n  <li>Illumina and
        IonTorrent reads can not be mixed in the same assembly.</li>\n  <li>PacBIO
        CLR needs to be run with at least one accompanying Illumina or IonTorrent
        library.</li>\n  <li>The k-mer parameter is autodetected by SPAdes, if the
        values are not specified in input.</li>\n  <li>The PHRED parameter is autodetected
        by ea-utils.</li>\n  <li>metaSPAdes might be very sensitive to the presence
        of the technical sequences remaining in the data (most notably adapter sequence
        regions), hence the authors recommend that you run quality control and pre-process
        your data prior to assembly. KBase has multiple Apps such as <a href= https://narrative.kbase.us/#catalog/apps/kb_trimmomatic/run_trimmomatic/release
        >Trimmomatic</a> and <a href= https://narrative.kbase.us/#catalog/apps/kb_cutadapt/remove_adapters/release
        >Cutadapt</a> that can be used for sequence cleaning.</li>\n</ul>\n</p>\n\n<p>For
        questions, please <a href= http://kbase.us/support/ >contact us</a>.</p>\n\n<p>SPAdes
        version: 3.15.3 was released under GPLv2 on July 22, 2021</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":["annotate_contigset"],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_SPAdes/run_metaSPAdes&image_name=metaspades-blue.png&tag=release"},"categories":["active","assembly","communities"],"screenshots":[],"publications":[{"pmid":"28298430","display_text":"Nurk
        S, Meleshko D, Korobeynikov A, Pevzner PA. metaSPAdes: a new versatile metagenomic
        assembler. Genome Res. 2017; 27:824 834. doi: 10.1101/gr.213959.116\n","link":"https://www.ncbi.nlm.nih.gov/pubmed/28298430"},{"pmid":"32559359","display_text":"Prjibelski
        A, Antipov D, Meleshko D, Lapidus A, Korobeynikov A. Using SPAdes De Novo
        Assembler. Curr Protoc Bioinformatics. 2020 Jun;70(1):e102. doi: 10.1002/cpbi.102.\n","link":"https://currentprotocols.onlinelibrary.wiley.com/doi/10.1002/cpbi.102"}],"namespace":"kb_SPAdes"}]]}'
