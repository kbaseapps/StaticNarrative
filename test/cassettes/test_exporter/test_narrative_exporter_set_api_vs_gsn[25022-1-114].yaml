      string: '{"version":"1.1","result":[[{"id":"kb_uploadmethods/import_fastq_sra_as_reads_from_staging","module_name":"kb_uploadmethods","git_commit_hash":"2135cd43a1b8b9c15d334c0b02f655c5e25264a2","name":"Import
        FASTQ/SRA File as Reads from Staging Area","ver":"1.0.56","authors":["tgu2"],"contact":"http://kbase.us/contact-us/","subtitle":"Import
        a FASTQ/SRA file into your Narrative as a Reads data object","tooltip":"Import
        a FASTQ/SRA file into your Narrative as a Reads data object","description":"<p>
        Import a FASTQ/SRA file into your Narrative as a Reads data object\nPlease
        see the <a href=\"http://kbase.us/data-upload-download-guide/\">Data Upload/Download
        Guide</a> for more information. </p>","technical_description":"none","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_uploadmethods/import_fastq_sra_as_reads_from_staging&image_name=data-pink.png&tag=release"},"categories":["inactive","reads","upload"],"screenshots":[],"publications":[],"namespace":"kb_uploadmethods"},{"id":"kb_Msuite/run_checkM_lineage_wf","module_name":"kb_Msuite","git_commit_hash":"69131f8ab95eb8bcb32ac7bd2443cbb28bf3c441","name":"Assess
        Genome Quality with CheckM - v1.1.2","ver":"1.4.2","authors":["dylan","msneddon","dparks","tgu2","seanjungbluth","ialarmedalien"],"contact":"http://www.kbase.us/support/","subtitle":"Runs
        the CheckM lineage workflow to assess the genome quality of isolates, single
        cells, or genome bins from metagenome assemblies through comparison to an
        existing database of genomes.","tooltip":"Runs the CheckM lineage workflow
        to assess the genome quality of isolates, single cells, or genome bins from
        metagenome assemblies through comparison to an existing database of genomes.","description":"<p><p>This
        App runs the CheckM lineage workflow (lineage_wf) automatically on the provided
        data and produces a report. CheckM is part of the M-suite collection of bioinformatic
        tools from the <a href= https://ecogenomic.org/ >Ecogenomics Group at the
        University of Queensland, Australia.</a></p>\n\n<p><hr></p>\n<p>CheckM provides
        a set of tools for assessing the quality of genomes recovered from isolates,
        single cells, or metagenomes. It provides robust estimates of genome completeness
        and contamination by using collocated sets of genes that are ubiquitous and
        single-copy within a phylogenetic lineage. Assessment of genome quality can
        also be examined using plots depicting key genomic characteristics (e.g.,
        GC, coding density) which highlight sequences outside the expected distributions
        of a typical genome. If you wish to make comments about the functional potential
        of a genome, look for maximum genome completeness and minimal contamination.
        Users should be aware that there are limitations to this approach. For a discussion
        of some of the assumptions of using a tool like CheckM see <a href= https://www.microbe.net/2017/12/13/why-genome-completeness-and-contamination-estimates-are-more-complicated-than-you-think/
        >this article</a>.</p>\n\n<p>If your workflow involves metagenome assembled
        genomes (MAGs), then CheckM QC is likely one of the first things you will
        want to perform (i.e. prior to annotation of the AssemblySet). This information
        will indicate which genome bins should be discarded (i.e. rendered as unbinned)
        prior to analyses of the bins (e.g. Add Species to Genome Tree, Taxonomic
        Classification).</p>\n\n<p><hr></p>\n<p><b>Tool and Data Sources:</b></p>\n<p><b>CheckM
        v1.1.2</b> is installed from <a href=\"https://github.com/Ecogenomics/CheckM/releases/tag/v1.1.2\">https://github.com/Ecogenomics/CheckM/releases/tag/v1.1.2</a>
        with reference data version <b>2015_01_16</b> from <a href=\"https://data.ace.uq.edu.au/public/CheckM_databases/checkm_data_2015_01_16.tar.gz\">https://data.ace.uq.edu.au/public/CheckM_databases/checkm_data_2015_01_16.tar.gz</a>.</p>\n\n<p><b>Input
        and Parameters:</b></p>\n<p><b><i>Assembly, Genome, or BinnedContigs:</i></b>
        A user may submit a single genome Assembly object, an AssemblySet, a Genome,
        a GenomeSet, or a BinnedContig object containing multiple \"binned\" genomes.
        For every input assemblies/genomes/bin, a separate evaluation of the genome
        completeness using the clade-specific phylogenetic marker genes will be performed.</p>\n<p><b><i>Save
        all plots:</i></b> The user has the option of generating and downloading all
        possible plots from the CheckM lineage workflow. Note that selecting this
        option will slow down the runtime (perhaps 10-20%).</p>\n\n<p><b>Output:</b></p>\n<p><b><i>Output
        Object:</i></b> No output object is generated by CheckM lineage assessment.  If
        you wish to filter a <b><i>BinnedContigs</i></b> object to obtain just the
        High Quality Bins, the <b>Filter Bins by Quality with CheckM</b> App does
        produce an output <b><i>BinnedContigs</i></b> object.</p>\n\n<p><b><i>Output
        Report:</i></b> The output report offers a tabular representations of the
        phylogenetic marker completeness and contamination. CheckM generates clade-specific
        marker gene sets for each bin and reports the taxonomic resolution possible
        for each bin in the \"Marker Lineage\" column. Users may want to look at the
        \"Marker Lineage\" column to see what MAGs were classified with, for example,
        the \"d__Bacteria\" or \"d__Archaea\" marker sets. Instances where a broad
        (domain-level) marker set is used compared to a marker set from specific lineage
        (e.g. c__Alphaproteobacteria) can help one contextualize (and evaluate) the
        genome completeness and contamination estimates.</p>\n\n<p>The number of Genomes
        that were used in generating each marker set is given, as is the number of
        markers generated. Marker genes are typically single-copy, so the occurrence
        of more than one in a given genome or bin may reveal contamination, which
        is indicated with yellow to red bars in the graphical depiction and by the
        columns \"2\" to \"5+\" in the table. As noted above in the article on assumptions,
        for incomplete genomes (e.g. 50-70%) the contamination measure is going to
        be an underestimate. In other words, be wary of a genome that is 50% complete
        with 0% contamination - contamination is present, this tool just doesn''t
        detect it.</p>\n\n<p>The fraction of marker genes that occur as duplicates
        is used to calculate the \"Contamination\" percentage in the table. Missing
        clade-specific phylogenetic markers are shown by the column \"0\" in the table,
        with the \"Completeness\" value obtained by the proportion of the missing
        markers to the total number of markers used. The presence of one and exactly
        one copy of a marker is indicated by the tally in the \"1\" column of the
        table. Ideally, <a href= https://www.nature.com/articles/nbt.3893 >a perfect
        Genome</a> will have all markers in exactly one copy assuming that the derivation
        of the markers was itself perfectly done and biology was perfectly <a href=
        https://www.nature.com/articles/nbt.3893/tables/1 >predictable.</a> Be sure
        to inspect results to ensure they are accurate. For example, for lineages
        not well-characterized in the CheckM database, the CheckM program will produce
        dubious results because marker gene assumptions are broken.</p>\n\n<p><b>Note:</b>
        CheckM no longer generates a Bin QA Plot as of the python3 version of the
        tool.</p>\n\n<p><b><i>Downloadable files:</i></b> The plots and data output
        by the CheckM lineage workflow may be downloaded.  Additionally, a Tab-delimited
        TSV table in zipped text format that contains the CheckM assessment summary
        (matching that in the HTML CheckM Table report) for each bin is available
        to download.</p>\n\n<p><hr></p>\n<p><strong>Team members who implemented App
        in KBase:</strong> <a href=\"https://narrative.kbase.us/#people/dylan\">Dylan
        Chivian</a> and <a href=\"https://narrative.kbase.us/#people/msneddon\">Michael
        Sneddon</a>. For questions, please <a href= http://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><strong>Please cite:</strong>\n  <ul>\n    <li>Parks DH,
        Imelfort M, Skennerton CT, Hugenholtz P, Tyson GW. CheckM: assessing the quality
        of microbial genomes recovered from isolates, single cells, and metagenomes.
        Genome Res. 2015;25: 1043 1055. doi:10.1101/gr.186072.114\n    <li>Chivian
        D, Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM,
        Gu T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
        RW, Henry CS, Arkin AP. Metagenome-assembled genome extraction and analysis
        from microbiomes using KBase. Nat Protoc. 2023 Jan;18(1):208-238. doi: 10.1038/s41596-022-00747-x\n  </ul>\n</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":["MetagenomeUtils.edit_bins_in_binned_contigs","MetagenomeUtils.edit_contigs_in_binned_contigs","MetagenomeUtils.extract_bins_as_assemblies"],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_Msuite/run_checkM_lineage_wf&image_name=checkm-green.png&tag=release"},"categories":["active","communities","assembly"],"screenshots":[{"url":"img?method_id=kb_Msuite/run_checkM_lineage_wf&image_name=CheckM_plot.png&tag=release"},{"url":"img?method_id=kb_Msuite/run_checkM_lineage_wf&image_name=CheckM_assess_table.png&tag=release"}],"publications":[{"pmid":"25977477","display_text":"Parks
        DH, Imelfort M, Skennerton CT, Hugenholtz P, Tyson GW. CheckM: assessing the
        quality of microbial genomes recovered from isolates, single cells, and metagenomes.
        Genome Res. 2015;25: 1043 1055. doi:10.1101/gr.186072.114\n","link":"https://genome.cshlp.org/content/25/7/1043.long"},{"display_text":"CheckM
        source:\n","link":"http://ecogenomics.github.io/CheckM/"},{"display_text":"Additional
        info:\n","link":"https://github.com/Ecogenomics/CheckM/wiki"},{"pmid":"36376589","display_text":"Chivian
        D, Jungbluth SP, Dehal PS, Wood-Charlson EM, Canon RS, Allen BH, Clark MM,
        Gu T, Land ML, Price GA, Riehl WJ, Sneddon MW, Sutormin R, Zhang Q, Cottingham
        RW, Henry CS, Arkin AP. Metagenome-assembled genome extraction and analysis
        from microbiomes using KBase. Nat Protoc. 2023 Jan;18(1):208-238. doi: 10.1038/s41596-022-00747-x\n","link":"https://www.nature.com/articles/s41596-022-00747-x"}],"namespace":"kb_Msuite"},{"id":"fba_tools/edit_media","module_name":"fba_tools","git_commit_hash":"f6f8088e846831fc94a0b0806d7a769dfaccf836","name":"Edit
        Media","ver":"1.7.5","authors":["chenry@mcs.anl.gov"],"contact":"http://kbase.us/contact-us/","subtitle":"Edit
        an existing media formulation.","tooltip":"Edit an existing media formulation.","description":"<p>Edit
        a media formulation by adding or removing compounds, changing concentrations,
        or adjusting flux bounds.</p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"categories":["active","metabolic_modeling"],"screenshots":[],"publications":[],"namespace":"fba_tools"},{"id":"RAST_SDK/reannotate_microbial_genome","module_name":"RAST_SDK","git_commit_hash":"3f29a5d57b362000c4aa9f6a71f3392ea453539e","name":"Annotate
        Microbial Genome with RASTtk - v1.073","ver":"1.8.1","authors":["chenry","olson"],"contact":"https://www.kbase.us/support/","subtitle":"Annotate
        or re-annotate bacterial or archaeal genome using RASTtk (Rapid Annotations
        using Subsystems Technology toolkit).","tooltip":"Annotate or re-annotate
        bacterial or archaeal genome using RASTtk (Rapid Annotations using Subsystems
        Technology toolkit).","description":"<p>This KBase annotation App (<a href=\"https://narrative.kbase.us/#appcatalog/app/RAST_SDK/annotate_microbial_genome/\">Annotate
        Microbial Genome</a>) uses components from the RAST (<a href= \"http://rast.nmpdr.org/\">Rapid
        Annotations using Subsystems Technology</a>) toolkit [1,2,3] to annotate a
        prokaryotic genome or to update the annotations of a genome.</p>\n<p>The release
        versions of the RASTtk component services used in this app are:\n<ul>\n  <li><a
        href=\"https://github.com/kbase/kb_seed\">kb_seed</a>: <i>tag 20200922</i></li>\n  <li><a
        href=\"https://github.com/kbase/kmer_annotation_figfam\">kmer_annotation_figfam</a>:
        <i>tag 20200922</i></li>\n  <li><a href=\"https://github.com/kbase/genome_annotation\">genome_annotation</a>:
        <i>tag 20200922</i></li>\n</ul>\n</p>\n\n<p>The Annotate Microbial Genome
        App takes a Genome-typed object as input and allows users to annotate or re-annotate
        the genome. This will make the annotations consistent with other KBase genomes
        and prepare the genome for further analysis by other KBase Apps, especially
        the Metabolic Modeling Apps.</p>\n\n<p>A Genome object can be <a href= http://kbase.us/data-upload-download-guide/genome/
        >imported</a> or generated with one of the following annotation Apps or their
        multi-object versions:\n<ul>\n<li><a href=\"https://narrative.kbase.us/#catalog/apps/RAST_SDK/annotate_contigset/release\">Annotate
        Microbial Assembly</a></li>\n<li><a href=\"https://narrative.kbase.us/#catalog/apps/RAST_SDK/reannotate_microbial_genome/release\">Annotate
        Microbial Genome</a></li>\n<li><a href=\"https://narrative.kbase.us/#catalog/apps/ProkkaAnnotation/annotate_contigs/release\">Annotate
        Assembly and Re-annotate Genomes with Prokka</a></li>\n</ul>\n</p>\n\n<p><strong>The
        Default Annotation Pipeline</strong><br>Clicking &quot;Run&quot; will run
        the default pipeline. For a typical 2-5 MBp genome, the default annotation
        pipeline should take about 5 minutes. It is assumed that Genomes already have
        some annotation. As a result, the default behavior of this App is to use SEED
        to re-annotate just the protein-encoding genes. The default pipeline for this
        App consists of the following steps:\n<ul>\n<li>DNA/RNA-based predictions\n<ol>\n<li><i>Call
        rRNAs (default = off)</i><br>Predict rRNAs in the genome. This is a custom
        BLAST-based tool for finding rRNAs.</li>\n<li><i>Call tRNAs with tRNAscan
        (default = off)</i><br>Predict tRNAs in the genome with tRNAscan-SE [6]. </li>\n<li><i>Call
        CRISPRs (default = off)</i><br>This is a custom tool that uses a perl regular
        expression-based search to find CRISPR elements.</li>\n<li><i>Find prophage
        elements with phispy (default = off)</i><br>This will use the phispy program
        to find prophage elements [13]. </li>\n</ol></li>\n\n<li>Gene predictions\n<ol>\n<li><i>Call
        protein-encoding genes with both Prodigal [11] and Glimmer3 [12] (default
        = off)</i><br><strong>These options will delete all existing genes in the
        genome object and replace them with the selected predictions.</strong></li>\n<li><i>Call
        selenoproteins and pyrrolysylproteins [7] (default = off)</i><br>These are
        custom BLAST-based tools.</li>\n</ol></li>\n\n<li>Repeats\n<ol>\n<li><i>Call
        <a href=\"http://www.theseed.org/wiki/Main_Page\">SEED</a> large repeat regions
        (default = off)</i><br>This is a BLASTn search within the genome for regions
        greater than 95% nucleotide similarity greater than or equal to 100bp in length.</li>\n<li><i>Find
        Streptococcus repeat regions [9, 10] (default = off)</i><br>This is a command
        should only be implemented if the genus is Streptococcus.</li>\n</ol></li>\n\n<li>Add
        SEED Functions/Annotation to protein-encoding genes (k-mers needed for Metabolic
        Modeling)\n<ol>\n<li><i>Annotate protein-encoding genes with k-mers (version
        2; default = on)</i><br>This is a set of signature k-mers (amino acid 8-mers)
        built from the annotations in the <a href=\"http://www.theseed.org/wiki/Main_Page\">CoreSEED</a>.
        The CoreSEED is a database of ~1,000 diverse microbial genomes and is currently
        the main focus of the RAST manual annotation efforts. Annotating using this
        k-mer set provides the user with our most stable and best estimate of the
        core gene functions.</li>\n\n<li><i>Annotate remaining hypothetical proteins
        with k-mers (version 1; default = on)</i><br>This set of k-mers is built from
        the FigFam collection [8] in the PubSEED, which is the publically annotated
        version of the SEED database that consists of ~12,000 microbial genomes. The
        &quot;classic&quot; version of RAST on the RAST website (http://rast.nmpdr.org)
        uses the FigFam-based k-mers (hence the version 1 designation).</li>\n\n<li><i>Annotate
        remaining hypothetical proteins by protein similarity (default = on)</i><br>We
        have several non-redundant databases for the most common genera.  If the genus
        name of your organism matches one of these, a search will be performed against
        the remaining hypothetical proteins to attempt to find a function.  The search
        uses a combination of BLAT [4] and BLAST [5].</li>\n</ol></li>\n\n<li>Other\n<ol>\n<li><i>Perform
        a basic gene overlap removal (default = off)</i><br>Using multiple gene calling
        algorithms can result in overlapping gene calls. This program is a custom
        tool that attempts to minimize overlaps and gaps to provide a set of calls
        that has a smaller number of gene calling errors. We do not recommend using
        overlap removal if you are attempting to annotate phage.</li>\n\n<li><i>Retain
        old annotations for hypotheticals (default = off)</i><br>In instances where
        the pipeline fails to find an annotation for a gene, this will retain the
        original annotation from the input Genome-typed object.</li>\n</ol></li>\n</ul>\n</p>\n\n<p><strong>Advanced
        Annotation Options</strong><br>If you wish to customize the features in your
        annotation, click the &quot;show advanced options&quot; link. This will display
        the full set of available annotation options.</p>\n\n<p><strong>The Results</strong>\n<ul>\n<li>The
        <i>Objects</i> section has a table of all the data objects that were created
        by the App. Click on the name of the data object to open a data viewer cell
        (below the currently selected cell).</li>\n<li>The <i>Summary</i> section
        give details about the coding and noncoding features that were created and
        the average protein length.</li>\n</ul>\n</p>\n\n<p><strong>GUI Output</strong><br>The
        GUI output currently consists of three tabs. The &quot;Overview&quot; tab
        provides basic information on the annotation job, the &quot;Browse Features&quot;
        tab allows the user to scroll through the features that were called,  and
        the &quot;Browse Contigs&quot; tab provides information on the contigs in
        the genome. Users can sort on the various types of features. Note that some
        features will overlap (e.g., &quot;prophage&quot; and &quot;CDS&quot;).</p>\n\n<p><strong>Additional
        Information</strong><br>For more information on the steps of the default RAStk
        pipeline please refer to our publication on this (publication forthcoming).
        For more detailed tutorial information and to explore the additional functionality
        of RASTtk not currently available in the Narrative interface, please refer
        to <a href=\"http://tutorial.theseed.org\">http://tutorial.theseed.org</a>.</p>\n\n<p><strong>Team
        members who developed & deployed algorithm in KBase:</strong>\nThomas Brettin,
        James Davis, Terry Disz, Robert Edwards, Chris Henry, Gary Olsen, Robert Olson,
        Ross Overbeek, Bruce Parrello, Gordon Pusch, Roman Sutormin, and Fangfang
        Xia. For questions, please <a href= https://www.kbase.us/support/ >contact
        us</a>.</p>\n\n<p><b><i>The authors of RAST request that if you use the results
        of this annotation in your work, please cite the first three listed publications:</i></b></p>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":["annotate_domains_in_genome_generic"],"related_apps":[],"next_apps":["build_fba_model","build_species_tree"]},"icon":{"url":"img?method_id=RAST_SDK/reannotate_microbial_genome&image_name=rast-red.png&tag=release"},"categories":["active","annotation"],"screenshots":[],"publications":[{"display_text":"[1]
