        Reads with Trimmomatic - v0.36","ver":"1.2.13","authors":["psdehal","dylan"],"contact":"http://kbase.us/contact-us/","subtitle":"Trim
        paired- or single-end Illumina reads with Trimmomatic.","tooltip":"Trim paired-
        or single-end Illumina reads with Trimmomatic.","description":"<p>This is
        a Narrative Method for running <a href=\"http://www.usadellab.org/cms/?page=trimmomatic\">Trimmomatic:
        A flexible read trimming tool for Illumina NGS data.</a> \nTrimmomatic is
        written by <a href=\"http://www.usadellab.org/cms/index.php?page=BolgerAnthony\">Anthony
        Bolger</a> from the <a href=\"http://www.usadellab.org\">Bjorn Usadel Lab</a>.
        \n </p>\n <br>\n Trimmomatic version: 0.36: <a href=\"http://www.usadellab.org/cms/uploads/supplementary/Trimmomatic/Trimmomatic-0.36.zip\">binary</a>,
        <a href=\"http://www.usadellab.org/cms/uploads/supplementary/Trimmomatic/Trimmomatic-Src-0.36.zip\">source</a>,
        <a href=\"http://www.usadellab.org/cms/uploads/supplementary/Trimmomatic/TrimmomaticManual_V0.32.pdf\">manual</a>.\n
        <br>\n <h3>Description</h3>\n <p>Trimmomatic performs a variety of useful
        trimming tasks for Illumina paired-end and single ended data. These tasks
        are performed as a series of steps. At least one step must be specified, and
        steps are run in the following order.</p>\n <p>The current steps are:</p>\n
        \n <h4>Adapter clipping:</h4> This step will remove Illumina adapters from
        the reads. You need to select one of the predefined adapter sets and set parameters
        for match criteria. Suggested adapter sequences are provided for TruSeq2 (as
        used in GAII machines) and TruSeq3 (as used by HiSeq and MiSeq machines),
        for both single-end and paired-end mode. You can find more information on
        the adapters in the <a href=\"http://www.usadellab.org/cms/uploads/supplementary/Trimmomatic/TrimmomaticManual_V0.32.pdf\">Trimmomatic
        manual</a>.\n <ul>\n <li><b>Adapters</b>: Select one of the predefined adapter
        sets.</li>\n <li><b>Seed mismatches</b>: The maximum number of mismatches
        that will allow a full match to be performed. To speed up search, short sections
        of each adapter (upto 16bp) are tested at all possible positions to find \"seeds\"
        that trigger a full alignment. This Seed mismatch parameter specifies the
        allowable mismatches for a seed.</li>\n <li><b>Simple clip threshold</b>:
        Alignment minimum score threshold for match, suggested values are 7-15. Score
        equals 0.6 per match minus Q/10 per mismatch.</li>\n <li><b>Palindrome clip
        threshold</b>: Using the same scoring as above, the pair of reads is aligned.
        Suggested value around 30.</li>\n </ul>\n \n <h4>Crop reads:</h4> Removes
        bases, regardless of their quality, from the end of the read, so that the
        read has the specified length. Steps performed after Crop might further shorten
        the read.\n <ul>\n <li><b>Crop length</b>: Number of bp to keep, from the
        start of the read.</li>\n </ul>\n\n <h4>Head crop:</h4> Removes the specified
        number of bases, regardless of quality, from the beginning of the read.\n
        <ul>\n <li><b>Head crop length</b>: Number of bp to remove from the start
        of a read.</li>\n </ul>\n \n <h4>Leading minimum quality:</h4> Remove low
        quality bases from the beginning, i.e., bases with a value below this threshold.\n
        <ul>\n <li><b>Leading minimum quality</b>: Minimum quality score.</li>\n </ul>\n
        \n <h4>Trailing minimum quality:</h4> Remove low quality bases from the end.
        As long as a base has a value below this threshold, the base is removed and
        the next base is investigated. This approach can be used for removing the
        special Illumina ''low quality segment'' regions (which have a quality score
        of 2), but we recommend Sliding window for that.\n <ul>\n <li><b>Trailing
        minimum quality</b>: Minimum quality score.</li>\n </ul>\n \n <h4>Sliding
        window:</h4> Performs sliding window trimming once the average quality within
        the window falls below specified threshold. By considering multiple bases,
        a single poor quality base will not cause the removal of high quality data
        later in the read.\n <ul>\n <li><b>Sliding window size</b>: length of window
        in bp.</li>\n <li><b>Sliding window minimum quality</b>: The average quality
        required.</li> \n </ul>\n \n <h4>Minimum read length:</h4> This removes reads
        that fall below the specified minimum length. Reads removed by this step are
        included in the ''dropped reads'' count.\n <ul>\n <li><b>Minimum read length</b>:
        Length in bp.</li>\n </ul>","technical_description":"","app_type":"app","suggestions":{"related_methods":[],"next_methods":[],"related_apps":[],"next_apps":[]},"icon":{"url":"img?method_id=kb_trimmomatic/run_trimmomatic&image_name=trimmomatic-pink.png&tag=release"},"categories":["active","reads"],"screenshots":[],"publications":[{"pmid":"24695404","display_text":"Bolger
        AM, Lohse M, Usadel B. Trimmomatic: a flexible trimmer for Illumina sequence
